site_name: md2beauty
site_description: Convert Markdown to HTML, DOCX, PPTX, PDF with theme support.
repo_url: https://github.com/creadri/md2beauty
repo_name: creadri/md2beauty

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tracking
    - content.code.copy
  palette:
    - scheme: slate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code

nav:
  - Home: index.md
  - Usage: usage.md
  - CLI: cli.md
  - API Reference:
      - md2beauty: api.md
