[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2beauty"
version = "0.1.0"
description = "Convert Markdown to HTML, DOCX, PPTX, PDF with theme support."
authors = [
    { name="Adrien Nelis" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.11.5",
]

[project.scripts]
md2beauty = "md2beauty.cli:main"

[project.optional-dependencies]
html = [
    "Pygments>=2.15.0",
]
docx = [
    "python-docx",
    "Pygments>=2.15.0",
]
pptx = [
    "python-pptx",
    "Pygments>=2.15.0",
]
pdf = [
    "weasyprint>=62.0",
]
all = [
    "Pygments>=2.15.0",
    "python-docx",
    "python-pptx",
    "weasyprint>=62.0",
]

dev = [
    "esbuild>=0.20.0; platform_system == 'Linux' or platform_system == 'Darwin'",
]

[tool.pytest.ini_options]
addopts = "-q --cov=md2beauty --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["md2beauty"]
omit = [
    "md2beauty/__main__.py",
]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["md2beauty*"]

[tool.setuptools.package-data]
md2beauty = [
    "js_renderers/*.mjs",
    "themes/*.json",
]
